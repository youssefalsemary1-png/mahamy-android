
name: Build Mahamy APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --project-name mahamy .

      - name: Enable Core Library Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              content = path.read_text()
              flag = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          elif groovy.exists():
              path = groovy
              content = path.read_text()
              flag = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          else:
              raise RuntimeError("Gradle app file not found")

          if "Core Library Desugaring" not in content and flag not in content:
              content, count = re.subn(
                  r'(compileOptions\s*\{)',
                  r'\1\n        ' + flag,
                  content,
                  count=1
              )
              if count == 0:
                  raise RuntimeError("Could not find compileOptions")

          if "desugar_jdk_libs" not in content:
              match = re.search(r'dependencies\s*\{', content)
              if match:
                  content = content[:match.end()] + "\n    " + dependency + content[match.end():]
              else:
                  content += "\ndependencies {\n    " + dependency + "\n}\n"

          path.write_text(content)
          print("Desugaring configured successfully.")
          PY

      - name: Configure notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>'
          ]

          for permission in permissions:
              if permission not in content:
                  content = content.replace(
                      '<application',
                      permission + '\n\n    <application',
                      1
                  )

          receivers = '''
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>

                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''

          if "ScheduledNotificationReceiver" not in content:
              content = content.replace(
                  '</application>',
                  receivers + '\n    </application>',
                  1
              )

          manifest.write_text(content)
          print("Notification configuration added successfully.")
          PY

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahamy-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
