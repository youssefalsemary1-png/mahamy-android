name: mahamy
description: تطبيق مهامي لتنظيم المهام اليومية
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "mahamy_app_icon.png"
  adaptive_icon_background: "#14212B"
  adaptive_icon_foreground: "mahamy_app_icon.png"
